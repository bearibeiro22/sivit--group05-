# usa o X-Correlation-ID do cliente se existir; senao gera um a partir do pedido
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

# access log em JSON, com o mesmo identificador de correlacao do portal
log_format sivit escape=json '{"ts":"$time_iso8601","servico":"nginx","metodo":"$request_method","caminho":"$uri","estado":$status,"duracao_s":$request_time,"correlation_id":"$correlation_id"}';

upstream portal {
    server portal:8000;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log sivit;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_hide_header X-Correlation-ID;
        add_header X-Correlation-ID $correlation_id always;
    }
}