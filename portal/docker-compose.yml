name: sivit-portal

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  portal:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py criar_grupos
        python manage.py collectstatic --noinput -v 0
        if [ "$${SIVIT_POVOAR:-0}" = "1" ]; then python manage.py povoar; fi
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers "$${GUNICORN_WORKERS:-3}" --access-logfile - --error-logfile -
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/pronto', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/usr/share/nginx/html/static:ro
    depends_on:
      portal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  static: