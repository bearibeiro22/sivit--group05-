services:
  sivitDB:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sivit
      POSTGRES_USER: sivit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivit -d sivit"]
      interval: 5s
      retries: 10

  portal:
    build: ./portal
    environment:
      DATABASE_URL: postgres://sivit:${POSTGRES_PASSWORD:-devpass}@sivitDB:5432/sivit
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-inseguro}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      LATENCIA_MS: ${LATENCIA_MS:-0}
    volumes:
      - static:/var/www/static
    depends_on:
      sivitDB:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - static:/var/www/static:ro
    depends_on:
      - portal

volumes:
  db_data:
  static:
