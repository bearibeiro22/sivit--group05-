upstream portal { server portal:8000; }

server {
    listen 80;

    location /static/ { alias /var/www/static/; }

    location / {
        proxy_pass http://portal;
        proxy_set_header Host $http_host;   # mantem a porta (:8080) nos links gerados
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
